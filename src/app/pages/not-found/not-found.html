<div class="not-found-shell">
  <mat-card class="not-found-card" appearance="outlined">
    <div class="error-figure" aria-label="404 not found illustration">
      <span class="error-code">404</span>
    </div>

    <div class="content">
      <p class="eyebrow">Page not found</p>
      <h1>Looks like this page wandered off</h1>
      <p class="subtitle">
        The link you followed may be broken, or the page may have been moved.
      </p>
    </div>

    <div class="actions">
      <button mat-flat-button color="primary" routerLink="/">Go home</button>
      <button mat-stroked-button color="primary" routerLink="/login">Back to login</button>
    </div>
  </mat-card>
</div>
